# Runs on pushed `v*` tags: builds the agent Flatpak bundle and the Android APK, uploads both
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Agent Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-musl

      - name: Install flatpak
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends flatpak

      # Cross-builds the static musl binary and assembles + exports the bundle (no aarch64 code runs).
      - name: Build bundle
        run: scripts/flatpak.sh

      # Unzipped single file; the artifact is named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: target/flatpak/framemate-agent.flatpak
          archive: false
          if-no-files-found: error

  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: app-android
          workspaces: app/src-tauri -> target

      # Gradle 8 doesn't run on newer JDKs.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            app/src-tauri/gen/android/**/*.gradle*
            app/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties

      # The runner image ships the Android SDK ($ANDROID_HOME), but not necessarily this NDK.
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install --frozen

      # Signed with the release key from the repository secrets (see build.gradle.kts).
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_PATH"
          deno task tauri android build --apk --target aarch64
          rm "$ANDROID_KEYSTORE_PATH"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            ../framemate.apk

      # Unzipped single file; the artifact is named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: framemate.apk
          archive: false
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [flatpak, apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag must match the versions baked into the builds (the APK's comes from
      # tauri.conf.json; Android won't update over a higher installed version).
      - name: Check version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(jq -r .version app/src-tauri/tauri.conf.json)
          agent=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag $tag, app $app, agent $agent"
          [[ "$app" == "$tag" && "$agent" == "$tag" ]] || {
            echo "::error::Tag v$tag doesn't match tauri.conf.json ($app) / Cargo.toml ($agent)"
            exit 1
          }

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f
          gh release create "$GITHUB_REF_NAME" $(find dist -type f) --generate-notes
